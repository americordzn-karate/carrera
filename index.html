<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Carrera contra el Conejo · Senshi-Kan</title>
<style>
  :root{
    --dojo-red:#c0392b;
    --dojo-gold:#e8b84b;
    --dojo-ink:#111417;
    --dojo-paper:#f4f1ea;
    --track-line:#f4f1ea;
    --ok-green:#4caf7d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    background:var(--dojo-ink);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    overflow:hidden;
    color:var(--dojo-paper);
    position:fixed;
    inset:0;
  }

  /* ---------- Escenario de cámara ---------- */
  #escenario{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
    overflow:hidden;
    background:#000;
  }
  #video{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:contain; /* muestra todo el campo de visión que ve el detector, sin recortar */
    background:#000;
    transform:scaleX(-1); /* efecto espejo para el jugador */
  }
  #capa-pista{
    position:absolute;inset:0;
    width:100%;height:100%;
    pointer-events:none;
  }
  .corredor{
    position:absolute;
    font-size:9vw;
    line-height:1;
    transform:translate(-50%,-50%);
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.6));
    transition:left .08s linear, top .08s linear;
    z-index:5;
  }
  #karateka{ z-index:6; }
  #conejo{ z-index:5; }

  /* ---------- HUD superior ---------- */
  #hud-superior{
    position:absolute;top:0;left:0;right:0;
    padding:10px 14px calc(10px + env(safe-area-inset-top));
    background:linear-gradient(180deg, rgba(0,0,0,.75), rgba(0,0,0,0));
    z-index:20;
    display:flex;flex-direction:column;gap:8px;
  }
  .fila-hud{display:flex;align-items:center;gap:10px;}
  .estado-texto{
    font-weight:700;font-size:15px;letter-spacing:.3px;
    color:var(--dojo-gold);
    flex:1;
  }
  #cronometro{
    font-variant-numeric:tabular-nums;
    font-weight:700;font-size:15px;
    background:rgba(0,0,0,.4);
    padding:4px 10px;border-radius:20px;
  }
  .barra-progreso-wrap{display:flex;align-items:center;gap:8px;}
  .etiqueta-barra{width:22px;font-size:16px;text-align:center;}
  .barra-fondo{
    flex:1;height:10px;border-radius:6px;
    background:rgba(255,255,255,.18);
    overflow:hidden;
  }
  .barra-fondo .relleno{
    height:100%;border-radius:6px;
    transition:width .15s linear;
  }
  #relleno-jugador{background:var(--dojo-red);}
  #relleno-conejo{background:var(--dojo-gold);}
  .pct-texto{width:54px;font-size:12px;text-align:right;font-variant-numeric:tabular-nums;opacity:.9;}
  #debug-deteccion{font-size:11px;opacity:.7;font-family:monospace;}

  /* ---------- Panel central ---------- */
  #panel-central{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    z-index:30;
    pointer-events:none;
  }
  #texto-central{
    font-weight:800;
    text-align:center;
    text-shadow:0 4px 14px rgba(0,0,0,.7);
    pointer-events:none;
  }
  .cuenta-numero{ font-size:min(28vw,180px); color:var(--dojo-gold); }
  .cuenta-ya{ font-size:min(16vw,100px); color:var(--ok-green); }
  .mensaje-calibracion{
    font-size:5vw;
    max-width:80vw;
    background:rgba(0,0,0,.55);
    padding:16px 20px;border-radius:14px;
    line-height:1.4;
  }
  @media (min-width:700px){ .mensaje-calibracion{font-size:22px;} }

  /* ---------- Botón inferior ---------- */
  #barra-inferior{
    position:absolute;bottom:0;left:0;right:0;
    padding:18px 16px;
    padding-bottom:max(22px, calc(env(safe-area-inset-bottom) + 16px));
    display:flex;justify-content:center;
    background:linear-gradient(0deg, rgba(0,0,0,.92) 0%, rgba(0,0,0,.75) 55%, rgba(0,0,0,0) 100%);
    z-index:20;
  }
  #btn-iniciar{
    appearance:none;border:none;
    background:var(--dojo-red);
    color:var(--dojo-paper);
    font-weight:800;font-size:17px;letter-spacing:.4px;
    padding:16px 38px;border-radius:30px;
    box-shadow:0 8px 20px rgba(0,0,0,.5), 0 0 0 2px rgba(244,241,234,.15);
    transition:opacity .2s, transform .1s;
    min-width:220px;
  }
  #btn-iniciar:disabled{ background:#555;color:#aaa;box-shadow:none; }
  #btn-iniciar:active:not(:disabled){transform:scale(.97);}

  /* ---------- Modal de resultado ---------- */
  #modal-resultado{
    position:fixed;inset:0;
    background:rgba(10,10,12,.88);
    display:none;
    align-items:center;justify-content:center;
    z-index:50;
    text-align:center;
    padding:24px;
  }
  #modal-resultado.visible{display:flex;}
  .tarjeta-resultado{
    background:var(--dojo-paper);color:var(--dojo-ink);
    border-radius:20px;
    padding:34px 28px;
    max-width:380px;width:100%;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
  }
  .icono-resultado{font-size:64px;margin-bottom:6px;}
  .titulo-resultado{font-size:24px;font-weight:800;margin:6px 0 2px;}
  .puntos-resultado{ font-size:34px;font-weight:800;margin:10px 0 4px; }
  .gano .puntos-resultado{color:var(--ok-green);}
  .perdio .puntos-resultado{color:var(--dojo-red);}
  .detalle-resultado{font-size:14px;opacity:.75;margin-bottom:6px;}
  #detalle-intentos{font-size:13px;opacity:.6;margin-bottom:18px;}
  .grupo-botones-resultado{display:flex;flex-direction:column;gap:10px;}
  #btn-reintentar{
    appearance:none;border:2px solid var(--dojo-ink);
    background:transparent;color:var(--dojo-ink);
    font-weight:700;font-size:15px;
    padding:11px 30px;border-radius:30px;
    width:100%;
  }
  #btn-reintentar:disabled{ border-color:#bbb;color:#bbb; }
  #btn-volver{
    appearance:none;border:none;
    background:var(--dojo-ink);color:var(--dojo-paper);
    font-weight:700;font-size:15px;
    padding:13px 30px;border-radius:30px;
    width:100%;
  }

  .oculto{display:none !important;}
</style>
</head>
<body>

<div id="escenario">
  <video id="video" autoplay playsinline muted></video>

  <svg id="capa-pista" viewBox="0 0 100 100" preserveAspectRatio="none">
    <ellipse id="ovalo-pista" cx="50" cy="52" rx="38" ry="30"
             fill="none" stroke="var(--track-line)" stroke-width="1.4"
             stroke-opacity="0.9"/>
    <line id="linea-meta" x1="50" y1="20" x2="50" y2="26"
          stroke="var(--dojo-gold)" stroke-width="2.4" stroke-linecap="round"/>
  </svg>

  <div id="conejo" class="corredor">🐇</div>
  <div id="karateka" class="corredor">🥷</div>

  <div id="hud-superior">
    <div class="fila-hud">
      <div class="estado-texto" id="texto-estado">Preparando cámara…</div>
      <div id="cronometro">00:00</div>
    </div>
    <div class="barra-progreso-wrap">
      <div class="etiqueta-barra">🥷</div>
      <div class="barra-fondo"><div class="relleno" id="relleno-jugador" style="width:0%"></div></div>
      <div class="pct-texto" id="pct-jugador">0</div>
    </div>
    <div class="barra-progreso-wrap">
      <div class="etiqueta-barra">🐇</div>
      <div class="barra-fondo"><div class="relleno" id="relleno-conejo" style="width:0%"></div></div>
      <div class="pct-texto" id="pct-conejo">0%</div>
    </div>
    <div id="debug-deteccion" class="oculto"></div>
  </div>

  <div id="panel-central">
    <div id="texto-central"></div>
  </div>

  <div id="barra-inferior">
    <button id="btn-iniciar" disabled>Cargando cámara…</button>
  </div>
</div>

<div id="modal-resultado">
  <div class="tarjeta-resultado" id="tarjeta-resultado">
    <div class="icono-resultado" id="icono-resultado">🏆</div>
    <div class="titulo-resultado" id="titulo-resultado">¡Ganaste!</div>
    <div class="puntos-resultado" id="puntos-resultado"></div>
    <div class="detalle-resultado" id="detalle-resultado"></div>
    <div class="detalle-resultado" id="detalle-intentos"></div>
    <div class="grupo-botones-resultado">
      <button id="btn-reintentar">Volver a correr</button>
      <button id="btn-volver">Volver al portal</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

<script>
/* ======================================================================
   CARRERA CONTRA EL CONEJO — Senshi-Kan Retos
   Correr en el lugar: cada paso (pie que sube mientras el otro permanece
   en el suelo) hace avanzar al ninja. Alternancia estricta de pies.
   ====================================================================== */

// ---------- 0. Configuración ajustable ----------
const CONFIG = {
  META_PASOS: 50,            // pasos necesarios para llegar a la meta
  CONEJO_TIEMPO_MIN: 30,     // segundos mínimos del conejo para completar la pista
  CONEJO_TIEMPO_MAX: 40,     // segundos máximos
  PUNTOS_GANAR: 20,
  PUNTOS_PERDER: -10,
  ELEVACION_CM: 3,           // diferencia de altura entre ambos pies (cm reales) para contar un paso
  FRACCION_ALTURA_REF: 0.5,  // distancia cadera-tobillo ≈ 50% de la estatura
  ALTURA_MIN_NORM: 0.15,     // cadera-pies mínimo (fracción del alto de imagen); menos = muy lejos
  MARGEN_RETORNO: 0.4,       // fracción del umbral para considerar "ambos pies abajo"
  INTERVALO_MIN_PASOS_MS: 120,
  CALIBRACION_MS: 4000,
  CALIBRACION_MIN_MUESTRAS: 25,
  VISIBILIDAD_MIN: 0.4
};

// ---------- 1. Parámetros recibidos desde el portal ----------
const parametrosURL = new URLSearchParams(window.location.search);
let estaturaParam = parseFloat(parametrosURL.get('estatura'));
if(!estaturaParam || estaturaParam <= 0) estaturaParam = 160;
if(estaturaParam < 3) estaturaParam *= 100; // por si llega en metros
const datosJugador = {
  nombre:   parametrosURL.get('nombre')   || '',
  edad:     parametrosURL.get('edad')     || '',
  reto:     parametrosURL.get('reto')     || 'CARRERA',
  estatura: estaturaParam, // cm
  peso:     parametrosURL.get('peso')     || ''
};
const DEBUG   = parametrosURL.get('debug') === '1';    // muestra panel de depuración
const TECLADO = parametrosURL.get('teclado') === '1';  // prueba sin cámara: ← y → simulan los pies

// ---------- 1b. Conexión con Apps Script / Google Sheets ----------
const ENDPOINT_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbwX5w8iiwkJVbGtpz-5f20U9jue2MC0vouE3blkHXo9CIMqg9bvCZrAYE8WKxH4gXGWzg/exec';
const NOMBRE_RETO_BD = 'CARRERA'; // Debe coincidir exactamente con Catalogo_Retos

function volverAlPortal(){
  const base = 'https://americordzn-karate.github.io/retos/';
  const params = new URLSearchParams({
    nombre: datosJugador.nombre,
    edad: datosJugador.edad,
    reto: datosJugador.reto,
    estatura: datosJugador.estatura,
    peso: datosJugador.peso
  });
  window.location.href = base + '?' + params.toString();
}
document.getElementById('btn-volver').addEventListener('click', volverAlPortal);

// ---------- 2. Referencias DOM ----------
const elVideo          = document.getElementById('video');
const elKarateka       = document.getElementById('karateka');
const elConejo         = document.getElementById('conejo');
const elTextoEstado    = document.getElementById('texto-estado');
const elCronometro     = document.getElementById('cronometro');
const elRellenoJug     = document.getElementById('relleno-jugador');
const elRellenoCon     = document.getElementById('relleno-conejo');
const elPctJug         = document.getElementById('pct-jugador');
const elPctCon         = document.getElementById('pct-conejo');
const elDebug          = document.getElementById('debug-deteccion');
const elTextoCentral   = document.getElementById('texto-central');
const elBtnIniciar     = document.getElementById('btn-iniciar');
const elBtnReintentar  = document.getElementById('btn-reintentar');
const elModal          = document.getElementById('modal-resultado');
const elTarjeta        = document.getElementById('tarjeta-resultado');
const elIcono          = document.getElementById('icono-resultado');
const elTitulo         = document.getElementById('titulo-resultado');
const elPuntos         = document.getElementById('puntos-resultado');
const elDetalle        = document.getElementById('detalle-resultado');
const elDetalleIntentos = document.getElementById('detalle-intentos');

if(DEBUG) elDebug.classList.remove('oculto');

// ---------- 3. Pista (elipse en % del contenedor) ----------
const PISTA = { cx:50, cy:52, rx:38, ry:30 };

function posicionEnPista(porcentaje){
  const t = Math.max(0, Math.min(100, porcentaje)) / 100;
  const anguloRad = (-90 + t * 360) * Math.PI / 180; // arranca arriba, sentido horario
  return {
    x: PISTA.cx + PISTA.rx * Math.cos(anguloRad),
    y: PISTA.cy + PISTA.ry * Math.sin(anguloRad)
  };
}
function actualizarPosicionCorredor(elemento, porcentaje){
  const p = posicionEnPista(porcentaje);
  elemento.style.left = p.x + '%';
  elemento.style.top  = p.y + '%';
}
actualizarPosicionCorredor(elKarateka, 0);
actualizarPosicionCorredor(elConejo, 0);

// ---------- 4. Audio ----------
let contextoAudio = null;
function obtenerContextoAudio(){
  if(!contextoAudio){
    contextoAudio = new (window.AudioContext || window.webkitAudioContext)();
  }
  if(contextoAudio.state === 'suspended') contextoAudio.resume();
  return contextoAudio;
}
function reproducirTono(frecuencia, duracionMs, tipo='sine', volumen=0.25){
  try{
    const ctx = obtenerContextoAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = tipo;
    osc.frequency.value = frecuencia;
    gain.gain.value = volumen;
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duracionMs/1000);
    osc.stop(ctx.currentTime + duracionMs/1000 + 0.02);
  }catch(e){ /* el audio nunca debe romper el juego */ }
}
function beepCuentaRegresiva(){ reproducirTono(440, 180, 'square', 0.22); }
function beepInicio(){ reproducirTono(880, 450, 'sawtooth', 0.28); }
function beepPaso(){ reproducirTono(660, 70, 'sine', 0.12); }
function beepFinal(gano){
  if(gano){
    reproducirTono(523, 150, 'sine', 0.25);
    setTimeout(()=>reproducirTono(659, 150, 'sine', 0.25), 150);
    setTimeout(()=>reproducirTono(784, 300, 'sine', 0.25), 300);
  } else {
    reproducirTono(300, 400, 'sawtooth', 0.25);
  }
}

// ---------- 5. Estado general ----------
const ESTADOS = {
  CARGANDO: 'CARGANDO',
  LISTO_PARA_CALIBRAR: 'LISTO_PARA_CALIBRAR',
  CALIBRANDO: 'CALIBRANDO',
  CUENTA_REGRESIVA: 'CUENTA_REGRESIVA',
  CARRERA: 'CARRERA',
  FINALIZADO: 'FINALIZADO'
};
let estadoJuego = ESTADOS.CARGANDO;

const juego = {
  pasos: 0,
  progresoJugador: 0,     // 0-100
  progresoConejo: 0,      // 0-100
  velocidadConejo: 0,     // %/segundo
  tiempoTotalConejo: 0,
  tiempoInicioCarrera: 0,
  ultimoFrame: 0,
  finalizado: false
};

// ---------- 6. Landmarks de los pies ----------
const CADERA_IZQ = 23, CADERA_DER = 24;
const PIE_IZQ = [27, 29, 31]; // tobillo, talón, punta
const PIE_DER = [28, 30, 32];

// Altura Y del pie (promedio ponderado por visibilidad). null si no se ve.
function yDelPie(landmarks, indices){
  const candidatos = indices.map(i => landmarks[i])
    .filter(p => p && p.visibility >= CONFIG.VISIBILIDAD_MIN);
  if(candidatos.length === 0) return null;
  let sumaY = 0, sumaPeso = 0;
  candidatos.forEach(p => { sumaY += p.y * p.visibility; sumaPeso += p.visibility; });
  return sumaY / sumaPeso;
}

function mediaRecortada(valores){
  const ordenados = [...valores].sort((a,b) => a - b);
  const recorte = Math.floor(ordenados.length * 0.1);
  const recortados = ordenados.slice(recorte, ordenados.length - recorte);
  const base = recortados.length ? recortados : ordenados;
  return base.reduce((s,v) => s + v, 0) / base.length;
}

// ---------- 7. Calibración ----------
const calibracion = {
  muestras: [],
  activa: false,
  tiempoInicio: 0,
  ultimaMuestraValida: 0,
  umbral: null,          // diferencia normalizada entre pies para contar un paso
  desfaseReposo: 0       // diferencia natural entre ambos pies en reposo
};

// Detección de pasos con alternancia estricta
const deteccion = {
  estado: 'NEUTRO',      // 'NEUTRO' | 'DER_ARRIBA' | 'IZQ_ARRIBA'
  ultimoPie: null,       // 'DER' | 'IZQ' (último paso contado)
  diffSuavizada: null,
  alpha: 0.6,
  ultimoPasoMs: 0,
  ultimoAvisoMs: 0
};

function iniciarCalibracion(){
  estadoJuego = ESTADOS.CALIBRANDO;
  calibracion.muestras = [];
  calibracion.activa = true;
  calibracion.tiempoInicio = performance.now();
  calibracion.ultimaMuestraValida = performance.now();
  reiniciarDeteccion();
  elTextoEstado.textContent = 'Calibrando…';
  mostrarMensajeCentral('mensaje-calibracion',
    'Colócate de pie, de frente, a unos 2 metros.<br>Deben verse tus caderas y tus pies.<br>Mantente quieto para calibrar…');

  if(TECLADO){ // modo prueba sin cámara
    calibracion.activa = false;
    calibracion.umbral = 0.03;
    calibracion.desfaseReposo = 0;
    iniciarCuentaRegresiva();
  }
}

function reiniciarDeteccion(){
  deteccion.estado = 'NEUTRO';
  deteccion.ultimoPie = null;
  deteccion.diffSuavizada = null;
  deteccion.ultimoPasoMs = 0;
}

// Y promedio de ambas caderas (null si no se ven)
function yDeCaderas(landmarks){
  const a = landmarks[CADERA_IZQ], b = landmarks[CADERA_DER];
  if(!a || !b || a.visibility < CONFIG.VISIBILIDAD_MIN || b.visibility < CONFIG.VISIBILIDAD_MIN) return null;
  return (a.y + b.y) / 2;
}

function procesarCalibracion(landmarks){
  const ahora = performance.now();
  const caderaY = landmarks ? yDeCaderas(landmarks) : null;
  const yIzq = landmarks ? yDelPie(landmarks, PIE_IZQ) : null;
  const yDer = landmarks ? yDelPie(landmarks, PIE_DER) : null;
  const valido = caderaY !== null && yIzq !== null && yDer !== null;

  if(valido){
    calibracion.ultimaMuestraValida = ahora;
    calibracion.muestras.push({ caderaY, yIzq, yDer });
  } else if(ahora - calibracion.ultimaMuestraValida > 2500){
    mostrarMensajeCentral('mensaje-calibracion',
      'No veo tus caderas y pies.<br>Aléjate un poco hasta que se vean de la cadera hacia abajo.');
    calibracion.tiempoInicio = ahora; // reinicia el conteo hasta que se vea bien
    calibracion.muestras = [];
    return;
  }

  if(valido){
    const transcurrido = ahora - calibracion.tiempoInicio;
    const restanteSeg = Math.max(0, Math.ceil((CONFIG.CALIBRACION_MS - transcurrido) / 1000));
    mostrarMensajeCentral('mensaje-calibracion',
      `Colócate de pie, de frente, con caderas y pies visibles.<br>Mantente quieto para calibrar… (${restanteSeg}s)`);

    if(transcurrido >= CONFIG.CALIBRACION_MS && calibracion.muestras.length >= CONFIG.CALIBRACION_MIN_MUESTRAS){
      finalizarCalibracion();
    }
  }
}

function finalizarCalibracion(){
  const caderaY = mediaRecortada(calibracion.muestras.map(m => m.caderaY));
  const piesY   = mediaRecortada(calibracion.muestras.map(m => (m.yIzq + m.yDer) / 2));
  const alturaNorm = piesY - caderaY; // distancia cadera-pies en unidades normalizadas (0-1)

  // Si la persona se ve muy pequeña, el umbral sería poco fiable: pedir que se acerque.
  if(alturaNorm < CONFIG.ALTURA_MIN_NORM){
    calibracion.muestras = [];
    calibracion.tiempoInicio = performance.now();
    mostrarMensajeCentral('mensaje-calibracion',
      'Te veo muy lejos.<br>Acércate un poco al teléfono (caderas y pies visibles) y mantente quieto…');
    return;
  }

  calibracion.activa = false;
  calibracion.desfaseReposo = mediaRecortada(calibracion.muestras.map(m => m.yIzq - m.yDer));

  // Conversión cm → unidades normalizadas usando la estatura real del alumno
  const alturaRefCm = datosJugador.estatura * CONFIG.FRACCION_ALTURA_REF;
  const normPorCm = alturaNorm / alturaRefCm;
  const umbral = CONFIG.ELEVACION_CM * normPorCm;
  calibracion.umbral = Math.min(0.08, Math.max(0.008, umbral));

  iniciarCuentaRegresiva();
}

// ---------- 8. Detección de pasos (alternancia estricta) ----------
function procesarDeteccionPasos(landmarks){
  if(!landmarks) return;
  const yIzq = yDelPie(landmarks, PIE_IZQ);
  const yDer = yDelPie(landmarks, PIE_DER);
  if(yIzq === null || yDer === null){
    elTextoEstado.textContent = 'Te veo incompleto: muestra ambos pies';
    return;
  }

  // Y crece hacia abajo: pie derecho levantado ⇒ yDer menor ⇒ diff positivo.
  const diffCruda = (yIzq - yDer) - calibracion.desfaseReposo;
  deteccion.diffSuavizada = deteccion.diffSuavizada === null
    ? diffCruda
    : deteccion.alpha * diffCruda + (1 - deteccion.alpha) * deteccion.diffSuavizada;

  evaluarDiferencia(deteccion.diffSuavizada);
}

function evaluarDiferencia(diff){
  const umbral = calibracion.umbral;
  if(DEBUG){
    elDebug.textContent = `diff:${diff.toFixed(3)} umbral:${umbral.toFixed(3)} estado:${deteccion.estado} ultimo:${deteccion.ultimoPie}`;
  }

  if(diff > umbral && deteccion.estado !== 'DER_ARRIBA'){
    deteccion.estado = 'DER_ARRIBA';
    intentarRegistrarPaso('DER');
  } else if(diff < -umbral && deteccion.estado !== 'IZQ_ARRIBA'){
    deteccion.estado = 'IZQ_ARRIBA';
    intentarRegistrarPaso('IZQ');
  } else if(Math.abs(diff) < umbral * CONFIG.MARGEN_RETORNO && deteccion.estado !== 'NEUTRO'){
    deteccion.estado = 'NEUTRO';
  }
}

function intentarRegistrarPaso(pie){
  const ahora = performance.now();
  if(pie === deteccion.ultimoPie){
    // Mismo pie dos veces seguidas: no cuenta. Aviso breve.
    if(ahora - deteccion.ultimoAvisoMs > 1500){
      deteccion.ultimoAvisoMs = ahora;
      elTextoEstado.textContent = '¡Alterna los pies!';
      setTimeout(() => { if(estadoJuego === ESTADOS.CARRERA) elTextoEstado.textContent = '¡Carrera en curso!'; }, 900);
    }
    return;
  }
  if(ahora - deteccion.ultimoPasoMs < CONFIG.INTERVALO_MIN_PASOS_MS) return;

  deteccion.ultimoPie = pie;
  deteccion.ultimoPasoMs = ahora;
  registrarPaso();
}

function registrarPaso(){
  if(juego.finalizado || estadoJuego !== ESTADOS.CARRERA) return;
  if(juego.pasos >= CONFIG.META_PASOS) return;
  juego.pasos += 1;
  juego.progresoJugador = Math.min(100, juego.pasos * 100 / CONFIG.META_PASOS);
  beepPaso();
  actualizarHUD();
  actualizarPosicionCorredor(elKarateka, juego.progresoJugador);
  verificarFinDeCarrera();
}

// Modo prueba por teclado: ← y → simulan los pies
if(TECLADO){
  document.addEventListener('keydown', (e) => {
    if(estadoJuego !== ESTADOS.CARRERA) return;
    if(e.key === 'ArrowLeft')  intentarRegistrarPaso('IZQ');
    if(e.key === 'ArrowRight') intentarRegistrarPaso('DER');
  });
}

// ---------- 9. Cuenta regresiva ----------
function iniciarCuentaRegresiva(){
  estadoJuego = ESTADOS.CUENTA_REGRESIVA;
  elTextoEstado.textContent = 'Prepárate…';
  let numero = 5;
  mostrarMensajeCentral('cuenta-numero', numero);
  beepCuentaRegresiva();

  const intervalo = setInterval(() => {
    numero -= 1;
    if(numero > 0){
      mostrarMensajeCentral('cuenta-numero', numero);
      beepCuentaRegresiva();
    } else {
      clearInterval(intervalo);
      mostrarMensajeCentral('cuenta-ya', '¡YA!');
      beepInicio();
      setTimeout(() => {
        limpiarMensajeCentral();
        iniciarCarrera();
      }, 500);
    }
  }, 1000);
}

// ---------- 10. Conejo ----------
function inicializarConejo(){
  juego.tiempoTotalConejo = CONFIG.CONEJO_TIEMPO_MIN +
    Math.random() * (CONFIG.CONEJO_TIEMPO_MAX - CONFIG.CONEJO_TIEMPO_MIN);
  juego.progresoConejo = 0;
  ajustarVelocidadConejo();
}

function ajustarVelocidadConejo(){
  const tiempoTranscurrido = (performance.now() - juego.tiempoInicioCarrera) / 1000;
  const tiempoRestante = Math.max(0.5, juego.tiempoTotalConejo - tiempoTranscurrido);
  const restanteProgreso = Math.max(0, 100 - juego.progresoConejo);
  const velocidadBase = restanteProgreso / tiempoRestante;
  const factorVariacion = 0.7 + Math.random() * 0.6;
  juego.velocidadConejo = Math.max(0.2, velocidadBase * factorVariacion);
}

// ---------- 11. Bucle de carrera ----------
let idIntervaloAjusteConejo = null;
let idAnimacion = null;

function iniciarCarrera(){
  estadoJuego = ESTADOS.CARRERA;
  elTextoEstado.textContent = '¡Carrera en curso!';
  juego.tiempoInicioCarrera = performance.now();
  juego.ultimoFrame = juego.tiempoInicioCarrera;

  inicializarConejo();
  idIntervaloAjusteConejo = setInterval(ajustarVelocidadConejo, 3000);
  idAnimacion = requestAnimationFrame(bucleAnimacion);
}

function bucleAnimacion(ahora){
  if(estadoJuego !== ESTADOS.CARRERA) return;

  const deltaSeg = (ahora - juego.ultimoFrame) / 1000;
  juego.ultimoFrame = ahora;

  juego.progresoConejo = Math.min(100, juego.progresoConejo + juego.velocidadConejo * deltaSeg);
  actualizarPosicionCorredor(elConejo, juego.progresoConejo);

  actualizarCronometro(ahora);
  actualizarHUD();
  verificarFinDeCarrera();

  if(estadoJuego === ESTADOS.CARRERA){
    idAnimacion = requestAnimationFrame(bucleAnimacion);
  }
}

function actualizarCronometro(ahora){
  const segundosTotales = Math.floor((ahora - juego.tiempoInicioCarrera) / 1000);
  const mm = String(Math.floor(segundosTotales / 60)).padStart(2,'0');
  const ss = String(segundosTotales % 60).padStart(2,'0');
  elCronometro.textContent = `${mm}:${ss}`;
}

function actualizarHUD(){
  elRellenoJug.style.width = juego.progresoJugador + '%';
  elRellenoCon.style.width = juego.progresoConejo + '%';
  elPctJug.textContent = `${juego.pasos}/${CONFIG.META_PASOS}`;
  elPctCon.textContent = Math.floor(juego.progresoConejo) + '%';
}

function verificarFinDeCarrera(){
  if(juego.finalizado || estadoJuego !== ESTADOS.CARRERA) return;
  if(juego.progresoJugador >= 100){
    finalizarCarrera(true);
  } else if(juego.progresoConejo >= 100){
    finalizarCarrera(false);
  }
}

function finalizarCarrera(jugadorGano){
  juego.finalizado = true;
  estadoJuego = ESTADOS.FINALIZADO;
  clearInterval(idIntervaloAjusteConejo);
  if(idAnimacion) cancelAnimationFrame(idAnimacion);
  controlAcceso.intentosEnEstaSesion += 1;
  beepFinal(jugadorGano);
  mostrarResultado(jugadorGano);
  enviarResultadoABD(jugadorGano);
}

function enviarResultadoABD(jugadorGano){
  if(!datosJugador.nombre){
    console.warn('Sin nombre de alumno: no se registran puntos.');
    return;
  }
  const puntos = jugadorGano ? CONFIG.PUNTOS_GANAR : CONFIG.PUNTOS_PERDER;
  fetch(ENDPOINT_APPS_SCRIPT, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      nombre_alumno: datosJugador.nombre,
      nombre_reto: NOMBRE_RETO_BD,
      puntos: puntos
    })
  }).catch((error) => {
    console.warn('No se pudo registrar el resultado en la base de datos:', error);
  });
}

function formatoPuntos(p){ return (p > 0 ? '+' : '−') + Math.abs(p) + ' pts'; }

function mostrarResultado(jugadorGano){
  elTarjeta.className = 'tarjeta-resultado ' + (jugadorGano ? 'gano' : 'perdio');
  elIcono.textContent = jugadorGano ? '🏆' : '🐇';
  elTitulo.textContent = jugadorGano ? '¡Ganaste la carrera!' : 'El conejo llegó primero';
  elPuntos.textContent = datosJugador.nombre
    ? formatoPuntos(jugadorGano ? CONFIG.PUNTOS_GANAR : CONFIG.PUNTOS_PERDER)
    : 'Sin puntos registrados';
  elDetalle.textContent = jugadorGano
    ? `Completaste los ${CONFIG.META_PASOS} pasos antes que el conejo.`
    : `Llevabas ${juego.pasos} de ${CONFIG.META_PASOS} pasos.`;

  const restantes = intentosDisponiblesRestantes();
  if(restantes > 0){
    elBtnReintentar.disabled = false;
    elBtnReintentar.textContent = 'Volver a correr';
    elDetalleIntentos.textContent = `Te queda${restantes === 1 ? '' : 'n'} ${restantes} intento${restantes === 1 ? '' : 's'} hoy en este reto.`;
  } else {
    elBtnReintentar.disabled = true;
    elBtnReintentar.textContent = 'Sin intentos disponibles';
    elDetalleIntentos.textContent = 'Alcanzaste el máximo de intentos de hoy en este reto.';
  }
  elModal.classList.add('visible');
}

function reiniciarJuego(){
  elModal.classList.remove('visible');

  juego.pasos = 0;
  juego.progresoJugador = 0;
  juego.progresoConejo = 0;
  juego.velocidadConejo = 0;
  juego.tiempoTotalConejo = 0;
  juego.tiempoInicioCarrera = 0;
  juego.ultimoFrame = 0;
  juego.finalizado = false;

  reiniciarDeteccion();
  calibracion.umbral = null;

  actualizarHUD();
  actualizarPosicionCorredor(elKarateka, 0);
  actualizarPosicionCorredor(elConejo, 0);
  elCronometro.textContent = '00:00';

  iniciarCalibracion(); // se recalibra: la distancia puede haber cambiado
}
elBtnReintentar.addEventListener('click', () => {
  if(elBtnReintentar.disabled) return;
  obtenerContextoAudio();
  reiniciarJuego();
});

// ---------- 12. Mensajes centrales ----------
function mostrarMensajeCentral(clase, contenido){
  elTextoCentral.className = clase;
  elTextoCentral.innerHTML = contenido;
}
function limpiarMensajeCentral(){
  elTextoCentral.className = '';
  elTextoCentral.innerHTML = '';
}

// ---------- 13. Intentos diarios ----------
const controlAcceso = {
  camaraLista: false,
  camaraConError: false,
  intentosVerificados: false,
  limiteAlcanzado: false,
  diarioPermitido: 999,
  intentosPrevios: 0,
  intentosEnEstaSesion: 0
};

function intentosDisponiblesRestantes(){
  const usados = controlAcceso.intentosPrevios + controlAcceso.intentosEnEstaSesion;
  return controlAcceso.diarioPermitido - usados;
}

async function verificarIntentosDiarios(){
  try{
    const respuesta = await fetch(ENDPOINT_APPS_SCRIPT, { method: 'GET' });
    const datos = await respuesta.json();

    const cataReto = (datos.retos || []).find(r => r.nombre === NOMBRE_RETO_BD);
    const diarioPermitido = cataReto ? parseInt(cataReto.diario_permitido) : 999;

    const clave = `${datosJugador.nombre}_${NOMBRE_RETO_BD}`;
    const intentosRealizados = (datos.intentosHoy && datos.intentosHoy[clave]) || 0;

    controlAcceso.diarioPermitido = diarioPermitido;
    controlAcceso.intentosPrevios = intentosRealizados;
    controlAcceso.limiteAlcanzado = intentosDisponiblesRestantes() <= 0;
    controlAcceso.intentosVerificados = true;
  } catch(error){
    console.warn('No se pudo verificar intentos diarios, se permite continuar:', error);
    controlAcceso.diarioPermitido = 999;
    controlAcceso.limiteAlcanzado = false;
    controlAcceso.intentosVerificados = true;
  }
  actualizarEstadoBoton();
}

function actualizarEstadoBoton(){
  if(controlAcceso.camaraConError){
    elBtnIniciar.disabled = true;
    elBtnIniciar.textContent = 'Cámara no disponible';
    elTextoEstado.textContent = 'No se pudo acceder a la cámara';
    return;
  }
  if(controlAcceso.intentosVerificados && controlAcceso.limiteAlcanzado){
    elBtnIniciar.disabled = true;
    elBtnIniciar.textContent = 'Límite diario alcanzado';
    elTextoEstado.textContent = 'Ya completaste tus intentos de hoy en este reto';
    return;
  }
  if(controlAcceso.camaraLista && controlAcceso.intentosVerificados){
    estadoJuego = ESTADOS.LISTO_PARA_CALIBRAR;
    elBtnIniciar.disabled = false;
    elBtnIniciar.textContent = 'Comenzar carrera';
    elTextoEstado.textContent = datosJugador.nombre ? 'Cámara lista' : 'Cámara lista (sin nombre: no se guardarán puntos)';
    return;
  }
  elBtnIniciar.disabled = true;
  elBtnIniciar.textContent = 'Verificando…';
  elTextoEstado.textContent = controlAcceso.camaraLista
    ? 'Verificando intentos disponibles…'
    : 'Preparando cámara…';
}

// ---------- 14. Cámara + MediaPipe Pose ----------
const pose = new Pose({
  locateFile: (archivo) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${archivo}`
});
pose.setOptions({
  modelComplexity: 1,
  smoothLandmarks: true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});
pose.onResults(onResultadosPose);

function onResultadosPose(resultados){
  const landmarks = resultados.poseLandmarks || null;
  if(estadoJuego === ESTADOS.CALIBRANDO && calibracion.activa){
    procesarCalibracion(landmarks);
  } else if(estadoJuego === ESTADOS.CARRERA){
    procesarDeteccionPasos(landmarks);
  }
}

// Bucle de envío de fotogramas: una sola solicitud de cámara, sin solapar llamadas.
async function bucleDeteccion(){
  if(elVideo.readyState >= 2){
    try{ await pose.send({ image: elVideo }); }
    catch(e){ console.warn('Error de detección:', e); }
  }
  if(elVideo.requestVideoFrameCallback) elVideo.requestVideoFrameCallback(bucleDeteccion);
  else requestAnimationFrame(bucleDeteccion);
}

async function iniciarCamara(){
  if(TECLADO){
    controlAcceso.camaraLista = true;
    actualizarEstadoBoton();
    return;
  }
  try{
    // Se pide siempre formato horizontal (campo de visión completo del sensor).
    // Pedir formato vertical hace que el teléfono recorte la imagen (efecto zoom).
    // Los modos 16:9 de muchas cámaras frontales recortan el sensor (zoom).
    // Se prueba primero 4:3 (sensor completo, campo de visión más amplio).
    const intentos = [
      { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 }, aspectRatio: { ideal: 4/3 } },
      { facingMode: 'user', width: { ideal: 640 },  height: { ideal: 480 }, aspectRatio: { ideal: 4/3 } },
      { facingMode: 'user' }
    ];
    let stream = null;
    for(const video of intentos){
      try{ stream = await navigator.mediaDevices.getUserMedia({ video, audio: false }); break; }
      catch(e){ console.warn('Configuración de cámara rechazada, probando otra:', e); }
    }
    if(!stream) throw new Error('No se pudo abrir la cámara');

    // Si la cámara soporta zoom, se lleva al mínimo (máxima apertura).
    try{
      const pista = stream.getVideoTracks()[0];
      const cap = pista.getCapabilities ? pista.getCapabilities() : {};
      if(cap.zoom) await pista.applyConstraints({ advanced: [{ zoom: cap.zoom.min }] });
      if(DEBUG){
        const s = pista.getSettings();
        elDebug.textContent = `cámara ${s.width}x${s.height} zoom:${s.zoom ?? 'n/d'} (rango ${cap.zoom ? cap.zoom.min + '-' + cap.zoom.max : 'n/d'})`;
      }
    }catch(e){ /* no todas las cámaras permiten ajustar el zoom */ }
    elVideo.srcObject = stream;
    await new Promise((resolve) => {
      if(elVideo.readyState >= 1) resolve(); else elVideo.onloadedmetadata = resolve;
    });
    await elVideo.play();

    bucleDeteccion();
    controlAcceso.camaraLista = true;
    actualizarEstadoBoton();
  } catch(error){
    console.error('Error al iniciar la cámara:', error);
    controlAcceso.camaraConError = true;
    actualizarEstadoBoton();
  }
}

elBtnIniciar.addEventListener('click', () => {
  if(estadoJuego !== ESTADOS.LISTO_PARA_CALIBRAR) return;
  obtenerContextoAudio(); // se activa el audio dentro del gesto del usuario (iOS/Safari)
  document.getElementById('barra-inferior').classList.add('oculto');
  iniciarCalibracion();
});

iniciarCamara();
verificarIntentosDiarios();
</script>
